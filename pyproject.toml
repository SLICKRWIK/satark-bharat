[project]
name = "satark-bharat"
version = "0.1.0"
description = "Multimodal, Pre-Transaction Neuro-Symbolic Sentinel for Indian Retail Investor Defense"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
    "gtts>=2.5.0",
    "pillow>=10.2.0",
    "reportlab>=4.2.0",
    "requests>=2.31.0",
    "dnspython>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]
advanced-ml = [
    "easyocr>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satark_bharat"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["BLE001", "S110", "RUF012", "E501"]
